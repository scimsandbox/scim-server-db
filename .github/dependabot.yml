version: 2

registries:
  # Docker Hardened Images (dhi.io) requires Docker Hub token authentication
  # on its OCI /v2/<repo>/tags/list endpoint. Ensure DOCKERHUB_TOKEN is exposed
  # under organization or repository Dependabot secrets.
  dhi:
    type: docker-registry
    url: https://dhi.io
    username: edipal
    password: ${{ secrets.DOCKERHUB_TOKEN }}

updates:
  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - dhi
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # Keep major dhi.io/flyway updates ungrouped (not ignored) so major Flyway
    # releases surface as separate manual-review PRs while auto-merge skips semver-major.
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
