name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Choose the semantic version bump for this release."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

jobs:
  release:
    name: Validate, tag, and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scim_db
          POSTGRES_USER: scim_user
          POSTGRES_PASSWORD: scim_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scim_user -d scim_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Verify main branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "This release workflow can only be run manually from main."
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "scimsandbox-release-bot[bot]"
          git config user.email "5655615+scimsandbox-release-bot[bot]@users.noreply.github.com"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          current_version="$(tr -d '[:space:]' < VERSION)"

          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "VERSION must contain a semantic version in the form x.y.z: ${current_version}" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          case "$VERSION_BUMP" in
            patch)
              patch="$((patch + 1))"
              ;;
            minor)
              minor="$((minor + 1))"
              patch=0
              ;;
            major)
              major="$((major + 1))"
              minor=0
              patch=0
              ;;
            *)
              echo "Unsupported version bump: ${VERSION_BUMP}" >&2
              exit 1
              ;;
          esac

          release_version="${major}.${minor}.${patch}"
          tag_name="v${release_version}"

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not exist
        shell: bash
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for pre-release scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: scim-server-db:pre-release-scan

      - name: Run Flyway migrations (V1 -> V5)
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --network host \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/scim_db \
            -e FLYWAY_USER=scim_user \
            -e FLYWAY_PASSWORD=scim_password \
            scim-server-db:pre-release-scan

      - name: Verify Flyway idempotency (second run with zero pending migrations)
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --network host \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/scim_db \
            -e FLYWAY_USER=scim_user \
            -e FLYWAY_PASSWORD=scim_password \
            scim-server-db:pre-release-scan

      - name: Run schema and constraint verification tests
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --network host \
            -e PGPASSWORD=scim_password \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            postgres:17-alpine \
            psql -h localhost -U scim_user -d scim_db -v ON_ERROR_STOP=1 -f /scripts/verify-schema.sql

      - name: Enforce pre-release Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scim-server-db:pre-release-scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: ".trivyignore"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Enforce pre-release Trivy config gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: "."
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: ".trivyignore"
          skip-setup-trivy: true

      - name: Commit version bump
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail

          printf '%s\n' "${RELEASE_VERSION}" > VERSION
          git add VERSION
          git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"

      - name: Package release bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail

          mkdir -p dist
          tar -czf "dist/scim-server-db-${RELEASE_VERSION}.tar.gz" \
            Dockerfile \
            LICENSE \
            VERSION \
            README.md \
            CONTRIBUTING.md \
            SECURITY.md \
            sql

      - name: Push release commit and tag
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail

          git push origin "HEAD:${TARGET_BRANCH}"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "refs/tags/${TAG_NAME}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail

          gh release create "${TAG_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "${TAG_NAME}" \
            "dist/scim-server-db-${RELEASE_VERSION}.tar.gz#scim-server-db-${RELEASE_VERSION}.tar.gz"

  attest:
    name: Attest release artifacts
    needs:
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.tar.gz" \
            --dir dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
