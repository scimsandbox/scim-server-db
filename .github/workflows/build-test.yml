name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build Flyway image and test PostgreSQL 17 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scim_db
          POSTGRES_USER: scim_user
          POSTGRES_PASSWORD: scim_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scim_user -d scim_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build scim-server-db:ci image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t scim-server-db:ci .

      - name: Run Flyway migrations (V1 -> V5)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/scim_db \
            -e FLYWAY_USER=scim_user \
            -e FLYWAY_PASSWORD=scim_password \
            scim-server-db:ci

      - name: Verify Flyway idempotency (second run with zero pending migrations)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/scim_db \
            -e FLYWAY_USER=scim_user \
            -e FLYWAY_PASSWORD=scim_password \
            scim-server-db:ci

      - name: Run schema and constraint verification tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=scim_password \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            postgres:17-alpine \
            psql -h localhost -U scim_user -d scim_db -v ON_ERROR_STOP=1 -f /scripts/verify-schema.sql

      - name: Test V4 -> V5 legacy password cleanup
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=scim_password postgres:17-alpine \
            psql -h localhost -U scim_user -d scim_db -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE scim_db_upgrade OWNER scim_user;"

          docker run --rm --network host \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/scim_db_upgrade \
            -e FLYWAY_USER=scim_user \
            -e FLYWAY_PASSWORD=scim_password \
            -e FLYWAY_TARGET=4 \
            scim-server-db:ci

          docker run --rm --network host -e PGPASSWORD=scim_password postgres:17-alpine \
            psql -h localhost -U scim_user -d scim_db_upgrade -v ON_ERROR_STOP=1 -c "
              INSERT INTO workspaces (id, name, created_by_username, created_at, updated_at)
              VALUES ('77777777-7777-7777-7777-777777777777', 'upgrade-ws', 'ci', NOW(), NOW());
              INSERT INTO scim_users (id, workspace_id, user_name, active, password, created_at, last_modified) VALUES
                ('71000000-0000-0000-0000-000000000001', '77777777-7777-7777-7777-777777777777', 'bcrypt@example.com', TRUE, '\$2b\$10\$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy', NOW(), NOW()),
                ('71000000-0000-0000-0000-000000000002', '77777777-7777-7777-7777-777777777777', 'plain@example.com', TRUE, 'legacy-plaintext', NOW(), NOW()),
                ('71000000-0000-0000-0000-000000000003', '77777777-7777-7777-7777-777777777777', 'empty@example.com', TRUE, '', NOW(), NOW());
            "

          docker run --rm --network host \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/scim_db_upgrade \
            -e FLYWAY_USER=scim_user \
            -e FLYWAY_PASSWORD=scim_password \
            scim-server-db:ci

          docker run --rm --network host -e PGPASSWORD=scim_password postgres:17-alpine \
            psql -h localhost -U scim_user -d scim_db_upgrade -v ON_ERROR_STOP=1 -c "
              DO \$\$
              BEGIN
                IF (SELECT password FROM scim_users WHERE id = '71000000-0000-0000-0000-000000000001')
                   IS DISTINCT FROM '\$2b\$10\$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy' THEN
                  RAISE EXCEPTION 'Expected valid BCrypt password to remain intact';
                END IF;
                IF (SELECT COUNT(*) FROM scim_users WHERE id IN ('71000000-0000-0000-0000-000000000002', '71000000-0000-0000-0000-000000000003') AND password IS NULL) <> 2 THEN
                  RAISE EXCEPTION 'Expected legacy plaintext and empty passwords to be NULL';
                END IF;
              END \$\$;
            "
